services:

  api:

    build:
      context: .

    container_name:
      enterprise-agent-api

    command:
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL:
        postgresql+psycopg://postgres:postgres@postgres:5432/enterprise_ops

      REDIS_URL:
        redis://redis:6379/0

    depends_on:
      - postgres
      - redis

    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs


  worker:

    build:
      context: .

    container_name:
      enterprise-agent-worker

    command:
      python -m scripts.run_worker

    env_file:
      - .env

    environment:
      DATABASE_URL:
        postgresql+psycopg://postgres:postgres@postgres:5432/enterprise_ops

      REDIS_URL:
        redis://redis:6379/0

    depends_on:
      - postgres
      - redis

    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs


  postgres:

    image:
      postgres:16

    container_name:
      enterprise-agent-db

    environment:
      POSTGRES_USER:
        postgres

      POSTGRES_PASSWORD:
        postgres

      POSTGRES_DB:
        enterprise_ops

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:

    image:
      redis:7

    container_name:
      enterprise-agent-redis

    ports:
      - "6379:6379"


volumes:

  postgres_data: