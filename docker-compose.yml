services:

  postgres:
    image: postgres:16

    container_name: enterprise_ops_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_ops
      POSTGRES_USER: enterprise_user
      POSTGRES_PASSWORD: enterprise_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U enterprise_user -d enterprise_ops"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: